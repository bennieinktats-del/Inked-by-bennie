<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inked by Bennie — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1,
    h2 {
      color: #d4af37;
    }

    .card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 14px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .gold {
      background: #d4af37;
      color: #000;
    }

    .approve {
      background: #2e8b57;
      color: white;
    }

    .reject {
      background: #a83232;
      color: white;
    }

    .logout {
      background: #333;
      color: white;
      float: right;
    }

    .booking {
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      margin: 12px 0;
      background: #101010;
    }

    .payment {
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      margin: 12px 0;
      background: #101010;
    }

    .status {
      font-weight: bold;
    }

    .pending {
      color: #d4af37;
    }

    .approved {
      color: #7CFC98;
    }

    .rejected {
      color: #ff6b6b;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      min-height: 20px;
    }

    .error {
      color: #ff6b6b;
      word-break: break-word;
    }

    .success {
      color: #7CFC98;
      font-weight: bold;
    }

    .deposit-box {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #d4af37;
      border-radius: 8px;
      background: #181818;
    }

    .deposit-box label {
      display: block;
      color: #d4af37;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .save-deposit {
      width: 100%;
      margin-top: 4px;
    }

    .action-box {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .action-box button {
      flex: 1;
      min-width: 130px;
    }

    .login-button {
      width: 100%;
      margin-top: 5px;
    }

    .login-help {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ========================= -->
  <!-- LOGIN -->
  <!-- ========================= -->

  <div id="loginSection" class="card">

    <h1>Inked by Bennie</h1>

    <h2>Admin Login</h2>

    <form id="loginForm">

      <label for="adminEmail">
        Email
      </label>

      <input
        type="email"
        id="adminEmail"
        required
        autocomplete="username"
        placeholder="Admin email"
      >

      <label for="adminPassword">
        Password
      </label>

      <input
        type="password"
        id="adminPassword"
        required
        autocomplete="current-password"
        placeholder="Password"
      >

      <button
        id="loginButton"
        class="gold login-button"
        type="submit"
      >
        Login
      </button>

    </form>

    <div
      id="loginMessage"
      class="message"
      aria-live="polite"
    ></div>

    <p class="login-help">
      This area is for Inked by Bennie administration only.
    </p>

  </div>


  <!-- ========================= -->
  <!-- ADMIN DASHBOARD -->
  <!-- ========================= -->

  <div id="dashboardSection" class="hidden">

    <button
      id="logoutButton"
      class="logout"
      type="button"
    >
      Log out
    </button>

    <h1>Admin Dashboard</h1>


    <!-- ========================= -->
    <!-- GIFT CARD PAYMENTS -->
    <!-- ========================= -->

    <div class="card">

      <h2>Gift Card Payments</h2>

      <button
        id="refreshPayments"
        class="gold"
        type="button"
      >
        Refresh Payments
      </button>

      <div id="paymentsList">
        Loading gift card payments...
      </div>

    </div>


    <!-- ========================= -->
    <!-- BOOKINGS -->
    <!-- ========================= -->

    <div class="card">

      <h2>Bookings</h2>

      <button
        id="refreshBookings"
        class="gold"
        type="button"
      >
        Refresh Bookings
      </button>

      <div id="bookingsList">
        Loading bookings...
      </div>

    </div>

  </div>

</div>


<script>

"use strict";


// ==========================================
// SUPABASE SETTINGS
// ==========================================

const SUPABASE_URL =
  "https://medadmstfuxqjnemjjqs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sPyYiyiKojy72MhKVCMvxQ_3I8gmUIO";


// ==========================================
// BOOKING APPROVAL EMAIL FUNCTION
// IMPORTANT: KEEP THIS SEPARATE
// ==========================================

const APPROVAL_EMAIL_FUNCTION_URL =
  "https://medadmstfuxqjnemjjqs.supabase.co/functions/v1/enking-approval";


// ==========================================
// PAYMENT APPROVAL EMAIL FUNCTION
// ==========================================

const PAYMENT_APPROVAL_EMAIL_FUNCTION_URL =
  "https://medadmstfuxqjnemjjqs.supabase.co/functions/v1/send-approved-booking-email";


// ==========================================
// ADMIN USER
// ==========================================

const ADMIN_USER_ID =
  "a76ab4e3-1744-4d8e-8a62-510a4c4bfb00";


// ==========================================
// ELEMENTS
// ==========================================

const loginSection =
  document.getElementById("loginSection");

const dashboardSection =
  document.getElementById("dashboardSection");

const loginForm =
  document.getElementById("loginForm");

const loginMessage =
  document.getElementById("loginMessage");

const loginButton =
  document.getElementById("loginButton");

const bookingsList =
  document.getElementById("bookingsList");

const paymentsList =
  document.getElementById("paymentsList");

const logoutButton =
  document.getElementById("logoutButton");

const refreshBookings =
  document.getElementById("refreshBookings");

const refreshPayments =
  document.getElementById("refreshPayments");


// ==========================================
// SHOW LOGIN
// ==========================================

function showLogin() {

  loginSection.classList.remove("hidden");

  dashboardSection.classList.add("hidden");

}


// ==========================================
// SHOW DASHBOARD
// ==========================================

function showDashboard() {

  loginSection.classList.add("hidden");

  dashboardSection.classList.remove("hidden");

  loadBookings();

  loadPayments();

}


// ==========================================
// LOGIN
// ==========================================

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    event.stopPropagation();

    const email =
      document
        .getElementById("adminEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("adminPassword")
        .value;


    if (!email || !password) {

      loginMessage.textContent =
        "Please enter your email and password.";

      loginMessage.className =
        "message error";

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
      "Logging in...";

    loginMessage.textContent =
      "Checking your login details...";

    loginMessage.className =
      "message";


    try {

      const response =
        await fetch(
          `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


      const responseText =
        await response.text();


      let data = {};

      try {

        data =
          responseText
            ? JSON.parse(responseText)
            : {};

      } catch {

        throw new Error(
          "Supabase returned an unexpected login response."
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error_description ||
          data.msg ||
          data.message ||
          data.error ||
          "Login failed. Please check your email and password."
        );

      }


      if (
        !data.access_token ||
        !data.refresh_token
      ) {

        throw new Error(
          "Login succeeded, but Supabase did not return a valid session."
        );

      }


      if (
        !data.user ||
        !data.user.id
      ) {

        throw new Error(
          "Supabase did not return your user account."
        );

      }


      console.log(
        "Logged-in Supabase user ID:",
        data.user.id
      );


      // ======================================
      // CHECK ADMIN USER
      // ======================================

      if (
        data.user.id !== ADMIN_USER_ID
      ) {

        localStorage.removeItem(
          "supabase_access_token"
        );

        localStorage.removeItem(
          "supabase_refresh_token"
        );

        throw new Error(
          "Your login details are correct, but this Supabase account is not authorized as the Inked by Bennie admin."
        );

      }


      // ======================================
      // SAVE SESSION
      // ======================================

      localStorage.setItem(
        "supabase_access_token",
        data.access_token
      );

      localStorage.setItem(
        "supabase_refresh_token",
        data.refresh_token
      );


      loginMessage.textContent =
        "Login successful.";

      loginMessage.className =
        "message success";


      showDashboard();

    }

    catch(error) {

      console.error(
        "LOGIN ERROR:",
        error
      );


      loginMessage.textContent =
        error.message ||
        "Login failed. Please check your email and password.";

      loginMessage.className =
        "message error";

    }

    finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "Login";

    }

  }
);


// ==========================================
// LOGOUT
// ==========================================

logoutButton.addEventListener(
  "click",
  function() {

    localStorage.removeItem(
      "supabase_access_token"
    );

    localStorage.removeItem(
      "supabase_refresh_token"
    );

    showLogin();

  }
);


// ==========================================
// SEND BOOKING APPROVAL EMAIL
// ==========================================

async function sendApprovalEmail(booking) {

  const token =
    localStorage.getItem(
      "supabase_access_token"
    );


  if (!token) {

    throw new Error(
      "Your admin session has expired. Please log in again."
    );

  }


  const response =
    await fetch(
      APPROVAL_EMAIL_FUNCTION_URL,
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          client_name:
            booking["Client name"] || "there",

          email:
            booking["Email"],

          booking_reference:
            booking["booking_reference"] ||
            booking["Booking reference"] ||
            "",

          preferred_date:
            booking["preferred_date"] ||
            booking["Preferred date"] ||
            "",

          preferred_time:
            booking["preferred_time"] ||
            booking["Preferred time"] ||
            "",

          deposit_amount:
            booking["deposit_amount"] ||
            ""

        })

      }
    );


  const responseText =
    await response.text();


  let result = {};

  try {

    result =
      responseText
        ? JSON.parse(responseText)
        : {};

  } catch {

    throw new Error(
      "Booking approval email function returned an unexpected response."
    );

  }


  if (!response.ok) {

    console.error(
      "BOOKING EMAIL ERROR:",
      result
    );

    throw new Error(
      result.error ||
      result.message ||
      `Email function failed with status ${response.status}.`
    );

  }


  return result;

}


// ==========================================
// SEND PAYMENT APPROVAL EMAIL
// ==========================================

        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          client_name:
            payment["Name"] || "there",

          email:
            payment["Email"],

          booking_reference:
            bookingReference,

          preferred_date:
            "",

          preferred_time:
            "",

          deposit_amount:
            payment["Deposit amount"] || "",

          gift_card_brand:
            payment["Gift card brand"] || "",

          gift_card_amount:
            payment["Gift card amount"] || "",

          gift_card_code:
            payment["Gift card code"] || "",

          payment_status:
            "Approved",

          payment_type:

// ==========================================
// UPDATE BOOKING STATUS
// ==========================================

async function updateBookingStatus(
  booking,
  newStatus,
  messageElement
) {

  const token =
    localStorage.getItem(
      "supabase_access_token"
    );


  if (!token) {

    messageElement.textContent =
      "Your admin session has expired. Please log in again.";

    messageElement.className =
      "message error";

    showLogin();

    return;

  }


  messageElement.textContent =
    "Updating...";

  messageElement.className =
    "message";


  try {

    // ======================================
    // UPDATE BOOKING STATUS
    // ======================================

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/Bookings?idd=eq.${encodeURIComponent(booking.idd)}`,
        {
          method: "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            "Booking status":
              newStatus

          })

        }
      );


    const responseText =
      await response.text();


    if (!response.ok) {

      console.error(
        "BOOKING STATUS UPDATE ERROR:",
        responseText
      );

      throw new Error(
        responseText ||
        "Unable to update booking status."
      );

    }


    // ======================================
    // BOOKING APPROVED
    // ======================================

    if (
      newStatus === "Approved"
    ) {

      messageElement.textContent =
        "Booking approved. Sending customer email...";

      messageElement.className =
        "message";


      try {

        await sendApprovalEmail(
          booking
        );


        messageElement.textContent =
          "Booking approved and approval email sent.";

        messageElement.className =
          "message success";

      }

      catch(emailError) {

        console.error(
          "BOOKING EMAIL SEND ERROR:",
          emailError
        );

        messageElement.textContent =
          "Booking approved, but the approval email could not be sent. Check the email function logs.";

        messageElement.className =
          "message error";

      }

    }

    else {

      messageElement.textContent =
        `Booking marked as ${newStatus}.`;

      messageElement.className =
        "message success";

    }


    loadBookings();

  }

  catch(error) {

    console.error(
      "BOOKING STATUS ERROR:",
      error
    );

    messageElement.textContent =
      "Could not update booking: " +
      error.message;

    messageElement.className =
      "message error";

  }

}


// ==========================================
// SAVE DEPOSIT AMOUNT
// ==========================================

async function saveDepositAmount(
  bookingId,
  inputElement,
  messageElement
) {

  const token =
    localStorage.getItem(
      "supabase_access_token"
    );


  if (!token) {

    messageElement.textContent =
      "Your admin session has expired. Please log in again.";

    messageElement.className =
      "message error";

    showLogin();

    return;

  }


  const amount =
    inputElement.value.trim();


  if (
    !amount ||
    Number(amount) <= 0
  ) {

    messageElement.textContent =
      "Please enter a valid deposit amount.";

    messageElement.className =
      "message error";

    return;

  }


  messageElement.textContent =
    "Saving...";

  messageElement.className =
    "message";


  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/Bookings?idd=eq.${encodeURIComponent(bookingId)}`,
        {
          method: "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            deposit_amount:
              Number(amount)

          })

        }
      );


    const responseText =
      await response.text();


    if (!response.ok) {

      throw new Error(
        responseText ||
        "Unable to save deposit amount."
      );

    }


    messageElement.textContent =
      `Deposit saved: $${Number(amount).toLocaleString()}`;

    messageElement.className =
      "message success";

  }

  catch(error) {

    console.error(
      "DEPOSIT ERROR:",
      error
    );

    messageElement.textContent =
      "Could not save deposit: " +
      error.message;

    messageElement.className =
      "message error";

  }

}
