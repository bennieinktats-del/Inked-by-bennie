<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inked by Bennie — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1, h2 {
      color: #d4af37;
    }

    .card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 14px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .gold {
      background: #d4af37;
      color: #000;
    }

    .logout {
      background: #333;
      color: white;
      float: right;
    }

    .booking {
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      margin: 12px 0;
      background: #101010;
    }

    .status {
      color: #d4af37;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="card">
    <h1>Inked by Bennie</h1>
    <h2>Admin Login</h2>

    <form id="loginForm">

      <label>Email</label>
      <input
        type="email"
        id="adminEmail"
        required
        placeholder="Admin email"
      >

      <label>Password</label>
      <input
        type="password"
        id="adminPassword"
        required
        placeholder="Password"
      >

      <button class="gold" type="submit">
        Login
      </button>

    </form>

    <div id="loginMessage" class="message"></div>
  </div>


  <!-- ADMIN DASHBOARD -->
  <div id="dashboardSection" class="hidden">

    <button id="logoutButton" class="logout">
      Log out
    </button>

    <h1>Admin Dashboard</h1>

    <div class="card">
      <h2>Bookings</h2>

      <button id="refreshBookings" class="gold">
        Refresh Bookings
      </button>

      <div id="bookingsList">
        Loading bookings...
      </div>
    </div>

  </div>

</div>


<script>

const SUPABASE_URL = "https://medadmstfuxqjnemjjqs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_sPyYiyiKojy72MhKVCMvxQ_3I8gmUIO";


const loginSection =
document.getElementById("loginSection");

const dashboardSection =
document.getElementById("dashboardSection");

const loginForm =
document.getElementById("loginForm");

const loginMessage =
document.getElementById("loginMessage");

const bookingsList =
document.getElementById("bookingsList");

const logoutButton =
document.getElementById("logoutButton");

const refreshBookings =
document.getElementById("refreshBookings");


// LOGIN
loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email =
    document.getElementById("adminEmail").value;

  const password =
    document.getElementById("adminPassword").value;

  loginMessage.textContent = "Logging in...";

  try {

    const response = await fetch(
      `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error_description ||
        data.msg ||
        "Login failed"
      );
    }

    localStorage.setItem(
      "supabase_access_token",
      data.access_token
    );

    localStorage.setItem(
      "supabase_refresh_token",
      data.refresh_token
    );

    loginMessage.textContent = "";

    loginSection.classList.add("hidden");
    dashboardSection.classList.remove("hidden");

    loadBookings();

  } catch (error) {

    console.error(error);

    loginMessage.textContent =
      "Login failed. Please check your email and password.";

  }

});


// LOAD BOOKINGS
async function loadBookings() {

  bookingsList.textContent =
    "Loading bookings...";

  const token =
    localStorage.getItem("supabase_access_token");

  if (!token) {
    return;
  }

  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/Bookings?select=*`,
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${token}`
        }
      }
    );

    const bookings =
      await response.json();

    if (!response.ok) {
      throw new Error(JSON.stringify(bookings));
    }

    if (!bookings.length) {

      bookingsList.innerHTML =
        "<p>No bookings yet.</p>";

      return;
    }


    bookingsList.innerHTML = "";


    bookings.forEach(booking => {

      const div =
        document.createElement("div");

      div.className = "booking";

      div.innerHTML = `

        <p>
          <strong>Client:</strong>
          ${booking["Client name"] || ""}
        </p>

        <p>
          <strong>Email:</strong>
          ${booking["Email"] || ""}
        </p>

        <p>
          <strong>Phone:</strong>
          ${booking["Phone"] || ""}
        </p>

        <p>
          <strong>Tattoo:</strong>
          ${booking["Tattoo details"] || ""}
        </p>

        <p>
          <strong>Type:</strong>
          ${booking["tattoo_type"] || ""}
        </p>

        <p>
          <strong>Placement:</strong>
          ${booking["Placement"] || ""}
        </p>

        <p>
          <strong>Size:</strong>
          ${booking["Size"] || ""}
        </p>

        <p>
          <strong>Booking status:</strong>
          <span class="status">
            ${booking["Booking status"] || "Pending"}
          </span>
        </p>

        <p>
          <strong>Deposit status:</strong>
          ${booking["Deposit status"] || "Not paid"}
        </p>

      `;

      bookingsList.appendChild(div);

    });


  } catch (error) {

    console.error(error);

    bookingsList.innerHTML =
      "<p>Unable to load bookings.</p>";

  }

}


// REFRESH
refreshBookings.addEventListener(
  "click",
  loadBookings
);


// LOG OUT
logoutButton.addEventListener(
  "click",
  function() {

    localStorage.removeItem(
      "supabase_access_token"
    );

    localStorage.removeItem(
      "supabase_refresh_token"
    );

    dashboardSection.classList.add("hidden");
    loginSection.classList.remove("hidden");

  }
);


// CHECK EXISTING LOGIN
if (
  localStorage.getItem(
    "supabase_access_token"
  )
) {

  loginSection.classList.add("hidden");
  dashboardSection.classList.remove("hidden");

  loadBookings();

}

</script>

</body>
  </html>
