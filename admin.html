<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inked by Bennie — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1,
    h2 {
      color: #d4af37;
    }

    .card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 14px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .gold {
      background: #d4af37;
      color: #000;
    }

    .approve {
      background: #2e8b57;
      color: white;
    }

    .reject {
      background: #a83232;
      color: white;
    }

    .logout {
      background: #333;
      color: white;
      float: right;
    }

    .booking {
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      margin: 12px 0;
      background: #101010;
    }

    .status {
      font-weight: bold;
    }

    .pending {
      color: #d4af37;
    }

    .approved {
      color: #7CFC98;
    }

    .rejected {
      color: #ff6b6b;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      min-height: 20px;
    }

    .error {
      color: #ff6b6b;
      word-break: break-word;
    }

    .success {
      color: #7CFC98;
      font-weight: bold;
    }

    .deposit-box {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #d4af37;
      border-radius: 8px;
      background: #181818;
    }

    .deposit-box label {
      display: block;
      color: #d4af37;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .save-deposit {
      width: 100%;
      margin-top: 4px;
    }

    .action-box {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .action-box button {
      flex: 1;
      min-width: 130px;
    }

    .login-button {
      width: 100%;
      margin-top: 5px;
    }

    .login-help {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- ========================= -->
  <!-- LOGIN -->
  <!-- ========================= -->

  <div id="loginSection" class="card">

    <h1>Inked by Bennie</h1>

    <h2>Admin Login</h2>

    <form id="loginForm">

      <label for="adminEmail">
        Email
      </label>

      <input
        type="email"
        id="adminEmail"
        required
        autocomplete="username"
        placeholder="Admin email"
      >

      <label for="adminPassword">
        Password
      </label>

      <input
        type="password"
        id="adminPassword"
        required
        autocomplete="current-password"
        placeholder="Password"
      >

      <button
        id="loginButton"
        class="gold login-button"
        type="submit"
      >
        Login
      </button>

    </form>

    <div
      id="loginMessage"
      class="message"
      aria-live="polite"
    ></div>

    <p class="login-help">
      This area is for Inked by Bennie administration only.
    </p>

  </div>


  <!-- ========================= -->
  <!-- ADMIN DASHBOARD -->
  <!-- ========================= -->

  <div
    id="dashboardSection"
    class="hidden"
  >
<div class="card">

  <h2>Gift Card Payments</h2>

  <button
    id="refreshPayments"
    class="gold"
    type="button"
  >
    Refresh Payments
  </button>

  <div id="paymentsList">
    Loading gift card payments...
  </div>

  </div>
    <button
      id="logoutButton"
      class="logout"
      type="button"
    >
      Log out
    </button>

    <h1>Admin Dashboard</h1>

    <div class="card">

      <h2>Bookings</h2>

      <button
        id="refreshBookings"
        class="gold"
        type="button"
      >
        Refresh Bookings
      </button>

      <div id="bookingsList">
        Loading bookings...
      </div>
    </div>


      </div>

    </div>

  </div>

<script>

"use strict";


// ==========================================
// SUPABASE SETTINGS
// ==========================================

const SUPABASE_URL =
  "https://medadmstfuxqjnemjjqs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sPyYiyiKojy72MhKVCMvxQ_3I8gmUIO";


// ==========================================
// APPROVAL EMAIL EDGE FUNCTION
// ==========================================

const APPROVAL_EMAIL_FUNCTION_URL =
  "https://medadmstfuxqjnemjjqs.supabase.co/functions/v1/send-approved-booking-email";

// ==========================================
// ADMIN USER
// ==========================================

const ADMIN_USER_ID =
  "a76ab4e3-1744-4d8e-8a62-510a4c4bfb00";


// ==========================================
// ELEMENTS
// ==========================================

const loginSection =
  document.getElementById("loginSection");

const dashboardSection =
  document.getElementById("dashboardSection");

const loginForm =
  document.getElementById("loginForm");

const loginMessage =
  document.getElementById("loginMessage");

const loginButton =
  document.getElementById("loginButton");

const bookingsList =
  document.getElementById("bookingsList");

const logoutButton =
  document.getElementById("logoutButton");

const refreshBookings =
  document.getElementById("refreshBookings");


// ==========================================
// SHOW LOGIN
// ==========================================

function showLogin() {

  loginSection.classList.remove("hidden");

  dashboardSection.classList.add("hidden");

}


// ==========================================
// SHOW DASHBOARD
// ==========================================

function showDashboard() {

  loginSection.classList.add("hidden");

  dashboardSection.classList.remove("hidden");

  loadBookings();
loadPayments();

}


// ==========================================
// LOGIN
// ==========================================

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    event.stopPropagation();

    const email =
      document
        .getElementById("adminEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("adminPassword")
        .value;


    if (!email || !password) {

      loginMessage.textContent =
        "Please enter your email and password.";

      loginMessage.className =
        "message error";

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
      "Logging in...";

    loginMessage.textContent =
      "Checking your login details...";

    loginMessage.className =
      "message";


    try {

      const response =
        await fetch(
          `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


      const responseText =
        await response.text();


      let data = {};

      try {

        data =
          responseText
            ? JSON.parse(responseText)
            : {};

      } catch {

        throw new Error(
          "Supabase returned an unexpected login response."
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error_description ||
          data.msg ||
          data.message ||
          data.error ||
          "Login failed. Please check your email and password."
        );

      }


      if (
        !data.access_token ||
        !data.refresh_token
      ) {

        throw new Error(
          "Login succeeded, but Supabase did not return a valid session."
        );

      }


      if (
        !data.user ||
        !data.user.id
      ) {

        throw new Error(
          "Supabase did not return your user account."
        );

      }


      console.log(
        "Logged-in Supabase user ID:",
        data.user.id
      );


      // --------------------------------------
      // CHECK ADMIN USER
      // --------------------------------------

      if (
        data.user.id !== ADMIN_USER_ID
      ) {

        localStorage.removeItem(
          "supabase_access_token"
        );

        localStorage.removeItem(
          "supabase_refresh_token"
        );

        throw new Error(
          "Your login details are correct, but this Supabase account is not authorized as the Inked by Bennie admin."
        );

      }


      // --------------------------------------
      // SAVE SESSION
      // --------------------------------------

      localStorage.setItem(
        "supabase_access_token",
        data.access_token
      );

      localStorage.setItem(
        "supabase_refresh_token",
        data.refresh_token
      );


      loginMessage.textContent =
        "Login successful.";

      loginMessage.className =
        "message success";


      showDashboard();

    }

    catch(error) {

      console.error(
        "LOGIN ERROR:",
        error
      );


      loginMessage.textContent =
        error.message ||
        "Login failed. Please check your email and password.";

      loginMessage.className =
        "message error";

    }

    finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "Login";

    }

  }
);


// ==========================================
// SEND APPROVAL EMAIL
// ==========================================
async function sendApprovalEmail(booking) {

  const token =
    localStorage.getItem(
      "supabase_access_token"
    );

  if (!token) {
    throw new Error(
      "Your admin session has expired. Please log in again."
    );
  }

  // Find the payment connected to this booking
  const paymentResponse =
    await fetch(
      `${SUPABASE_URL}/rest/v1/Gift%20card%20payments?select=*&booking_reference=eq.${encodeURIComponent(booking["booking_reference"])}`,
      {
        method: "GET",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        }
      }
    );

  const paymentText =
    await paymentResponse.text();

  let payments = [];

  try {
    payments =
      paymentText
        ? JSON.parse(paymentText)
        : [];
  } catch {
    throw new Error(
      "Could not read the gift card payment."
    );
  }

  if (!paymentResponse.ok) {
    throw new Error(
      "Unable to load the gift card payment."
    );
  }

  const payment =
    payments.length > 0
      ? payments[0]
      : {};

  // Send booking + payment details to email function
  const response =
    await fetch(
      APPROVAL_EMAIL_FUNCTION_URL,
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          client_name:
            booking["Client name"] || "there",

          email:
            booking["Email"],

          booking_reference:
            booking["booking_reference"],

          preferred_date:
            booking["preferred_date"],

          preferred_time:
            booking["preferred_time"],

          deposit_amount:
            booking["deposit_amount"],

          gift_card_brand:
            payment["Gift card brand"] || "",

          gift_card_amount:
            payment["Gift card amount"] || "",

          gift_card_code:
            payment["Gift card code"] || "",

          payment_status:
            payment["Payment status"] || "",

          payment_type:
            payment["Payment type"] || ""

        })

      }
    );

  const responseText =
    await response.text();

  let result = {};

  try {
    result =
      responseText
        ? JSON.parse(responseText)
        : {};
  } catch {
    throw new Error(
      "Approval email function returned an unexpected response."
    );
  }

  if (!response.ok) {
    console.error(
      "APPROVAL EMAIL ERROR:",
      result
    );

    throw new Error(
      result.error ||
      result.message ||
      `Email function failed with status ${response.status}.`
    );
  }

  return result;
  }

// ==========================================
// UPDATE BOOKING STATUS
// ==========================================

async function updateBookingStatus(
  booking,
  newStatus,
  messageElement
) {

  const token =
    localStorage.getItem(
      "supabase_access_token"
    );


  if (!token) {

    messageElement.textContent =
      "Your admin session has expired. Please log in again.";

    messageElement.className =
      "message error";

    showLogin();

    return;

  }


  messageElement.textContent =
    "Updating...";

  messageElement.className =
    "message";


  try {

    // --------------------------------
    // UPDATE BOOKING STATUS
    // --------------------------------

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/Bookings?idd=eq.${encodeURIComponent(booking.idd)}`,
        {
          method: "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            "Booking status":
              newStatus

          })

        }
      );


    const responseText =
      await response.text();


    if (!response.ok) {

      console.error(
        "STATUS UPDATE ERROR:",
        responseText
      );

      throw new Error(
        responseText ||
        "Unable to update booking status."
      );

    }


    // --------------------------------
    // SEND APPROVAL EMAIL
    // --------------------------------

    if (
      newStatus === "Approved"
    ) {

      messageElement.textContent =
        "Booking approved. Sending customer email...";

      messageElement.className =
        "message";


      try {

        await sendApprovalEmail(
          booking
        );


        messageElement.textContent =
          "Booking approved and approval email sent.";

        messageElement.className =
          "message success";

      }

      catch(emailError) {

        console.error(
          "EMAIL SEND ERROR:",
          emailError
        );

        messageElement.textContent =
          "Booking approved, but the approval email could not be sent. Check the email function logs.";

        messageElement.className =
          "message error";

      }

    }

    else {

      messageElement.textContent =
        `Booking marked as ${newStatus}.`;

      messageElement.className =
        "message success";

    }


    loadBookings();

  }

  catch(error) {

    console.error(
      "STATUS ERROR:",
      error
    );

    messageElement.textContent =
      "Could not update booking: " +
      error.message;

    messageElement.className =
      "message error";

  }

}


// ==========================================
// SAVE DEPOSIT AMOUNT
// ==========================================

async function saveDepositAmount(
  bookingId,
  inputElement,
  messageElement
) {

  const token =
    localStorage.getItem(
      "supabase_access_token"
    );


  if (!token) {

    messageElement.textContent =
      "Your admin session has expired. Please log in again.";

    messageElement.className =
      "message error";

    showLogin();

    return;

  }


  const amount =
    inputElement.value.trim();


  if (
    !amount ||
    Number(amount) <= 0
  ) {

    messageElement.textContent =
      "Please enter a valid deposit amount.";

    messageElement.className =
      "message error";

    return;

  }


  messageElement.textContent =
    "Saving...";

  messageElement.className =
    "message";


  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/Bookings?idd=eq.${encodeURIComponent(bookingId)}`,
        {
          method: "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            deposit_amount:
              Number(amount)

          })
        }
      );


    const responseText =
      await response.text();


    if (!response.ok) {

      throw new Error(
        responseText ||
        "Unable to save deposit amount."
      );

    }


    messageElement.textContent =
      `Deposit saved: $${Number(amount).toLocaleString()}`;

    messageElement.className =
      "message success";

  }

  catch(error) {

    console.error(
      "DEPOSIT ERROR:",
      error
    );

    messageElement.textContent =
      "Could not save deposit: " +
      error.message;

    messageElement.className =
      "message error";

  }

}


// ==========================================
// LOAD BOOKINGS
// ==========================================

async function loadBookings() {

  bookingsList.innerHTML =
    "<p>Loading bookings...</p>";


  const token =
    localStorage.getItem(
      "supabase_access_token"
    );


  if (!token) {

    bookingsList.innerHTML =
      "<p class='error'>Your admin session has expired. Please log in again.</p>";

    showLogin();

    return;

  }


  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/Bookings?select=*&order=idd.desc`,
        {
          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json"

          }

        }
      );


    const responseText =
      await response.text();


    let bookings;


    try {

      bookings =
        JSON.parse(responseText);

    }

    catch {

      throw new Error(
        "Supabase returned an unexpected response: " +
        responseText
      );

    }


    if (!response.ok) {

      throw new Error(
        JSON.stringify(bookings)
      );

    }


    if (!Array.isArray(bookings)) {

      throw new Error(
        "The Bookings response was not a list."
      );

    }


    if (bookings.length === 0) {

      bookingsList.innerHTML =
        "<p>No bookings yet.</p>";

      return;

    }


    bookingsList.innerHTML = "";


    bookings.forEach(
      function(booking) {

        const div =
          document.createElement("div");

        div.className =
          "booking";


        const currentStatus =
          booking["Booking status"] ||
          "Pending";


        let statusClass =
          "pending";


        if (
          currentStatus === "Approved"
        ) {

          statusClass =
            "approved";

        }


        if (
          currentStatus === "Rejected"
        ) {

          statusClass =
            "rejected";

        }


        div.innerHTML = `

          <p>
            <strong>Client:</strong>
            ${booking["Client name"] || ""}
          </p>

          <p>
            <strong>Booking reference:</strong>
            ${booking["booking_reference"] || "Not available"}
          </p>

          <p>
            <strong>Email:</strong>
            ${booking["Email"] || ""}
          </p>

          <p>
            <strong>Phone:</strong>
            ${booking["Phone"] || ""}
          </p>

          <p>
            <strong>Tattoo:</strong>
            ${booking["Tattoo details"] || ""}
          </p>

          <p>
            <strong>Type:</strong>
            ${booking["Type"] || booking["type"] || "Not specified"}
          </p>

          <p>
            <strong>Preferred date:</strong>
            ${booking["preferred_date"] || "Not specified"}
          </p>

          <p>
            <strong>Preferred time:</strong>
            ${booking["preferred_time"] || "Not specified"}
          </p>

          <p>
            <strong>Status:</strong>
            <span class="status ${statusClass}">
              ${currentStatus}
            </span>
          </p>

          <div class="deposit-box">

            <label>
              Deposit amount (USD)
            </label>

            <input
              type="number"
              class="deposit-input"
              min="0"
              step="0.01"
              placeholder="Enter deposit amount in USD"
              value="${booking["deposit_amount"] || ""}"
            >

            <button
              class="gold save-deposit"
              type="button"
            >
              Save Deposit
            </button>

            <div
              class="message deposit-message"
            ></div>

          </div>

          <div class="action-box">

            <button
              class="approve approve-button"
              type="button"
            >
              Approve Booking
            </button>

            <button
              class="reject reject-button"
              type="button"
            >
              Reject Booking
            </button>

          </div>

          <div
            class="message status-message"
          ></div>

        `;


        const depositInput =
          div.querySelector(
            ".deposit-input"
          );


        const saveButton =
          div.querySelector(
            ".save-deposit"
          );


        const depositMessage =
          div.querySelector(
            ".deposit-message"
          );


        const approveButton =
          div.querySelector(
            ".approve-button"
          );


        const rejectButton =
          div.querySelector(
            ".reject-button"
          );


        const statusMessage =
          div.querySelector(
            ".status-message"
          );


        saveButton.addEventListener(
          "click",
          function() {

            saveDepositAmount(
              booking.idd,
              depositInput,
              depositMessage
            );

          }
        );


        approveButton.addEventListener(
          "click",
          function() {

            updateBookingStatus(
              booking,
              "Approved",
              statusMessage
            );

          }
        );


        rejectButton.addEventListener(
          "click",
          function() {

            updateBookingStatus(
              booking,
              "Rejected",
              statusMessage
            );

          }
        );


        bookingsList.appendChild(
          div
        );

      }
    );

  }

  catch(error) {

    console.error(
      "BOOKING LOAD ERROR:",
      error
    );

    bookingsList.innerHTML = `

      <p class="error">
        Unable to load bookings.
      </p>

      <p class="error">
        ${error.message}
      </p>

    `;

  }

}


// ==========================================
// REFRESH BOOKINGS
// ==========================================

refreshBookings.addEventListener(
  "click",
  loadBookings
);


// ==========================================
// LOG OUT
// ==========================================

logoutButton.addEventListener(
  "click",
  function() {

    localStorage.removeItem(
      "supabase_access_token"
    );

    localStorage.removeItem(
      "supabase_refresh_token"
    );

    showLogin();

    loginMessage.textContent =
      "You have been logged out.";

    loginMessage.className =
      "message success";

  }
);


// ==========================================
// CHECK EXISTING LOGIN
// ==========================================

const existingToken =
  localStorage.getItem(
    "supabase_access_token"
  );


if (existingToken) {

  showDashboard();

} else {

  showLogin();

}
// ==========================================
// GIFT CARD PAYMENTS
// ==========================================

async function loadPayments() {

  const paymentsList =
    document.getElementById("paymentsList");

  if (!paymentsList) return;

  paymentsList.innerHTML =
    "Loading gift card payments...";

  try {

    const token =
      localStorage.getItem(
        "supabase_access_token"
      );

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/Gift%20card%20payments?select=*&order=Created%20at.desc`,
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          }
        }
      );

    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }

    const payments =
      await response.json();

    if (!payments.length) {

      paymentsList.innerHTML =
        "<p>No gift card payments yet.</p>";

      return;

    }

    paymentsList.innerHTML =
      payments.map(function(payment) {

        return `
          <div class="booking-card">

            <h3>
              ${payment["Name"] || "No name"}
            </h3>

            <p>
              <strong>Email:</strong>
              ${payment["Email"] || ""}
            </p>

            <p>
              <strong>Phone:</strong>
              ${payment["Phone"] || ""}
            </p>

            <p>
              <strong>Booking reference:</strong>
              ${payment["Booking reference"] ||
                payment["booking_reference"] ||
                "Not provided"}
            </p>

            <p>
              <strong>Gift card brand:</strong>
              ${payment["Gift card brand"] || ""}
            </p>

            <p>
              <strong>Gift card amount:</strong>
              $${payment["Gift card amount"] || "0"}
            </p>

            <p>
              <strong>Gift card code:</strong>
              ${payment["Gift card code"] || ""}
            </p>

            <p>
              <strong>Payment status:</strong>
              ${payment["Payment status"] || "Pending"}
            </p>

            <p>
              <strong>Payment type:</strong>
              ${payment["Payment type"] || ""}
            </p>

          </div>
        `;

      }).join("");

  }

  catch(error) {

    console.error(
      "PAYMENT LOAD ERROR:",
      error
    );

    paymentsList.innerHTML = `
      <p class="error">
        Unable to load gift card payments.
      </p>

      <p class="error">
        ${error.message}
      </p>
    `;

  }

}


// ==========================================
// REFRESH PAYMENTS
// ==========================================

const refreshPayments =
  document.getElementById(
    "refreshPayments"
  );


if (refreshPayments) {

  refreshPayments.addEventListener(
    "click",
    loadPayments
  );

  }
</script>

</body>
</html>
