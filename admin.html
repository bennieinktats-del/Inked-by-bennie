/* =========================

========================= */

function getHeaders(){

const token =
localStorage.getItem(
"admin_access_token"
);

return {

"apikey":
SUPABASE_KEY,

"Authorization":
`Bearer ${token}`,

"Content-Type":
"application/json"

};

}


/* =========================
LOGIN
========================= */

loginForm.addEventListener(
"submit",
async function(event){

event.preventDefault();

const email =
document
.getElementById("adminEmail")
.value
.trim();

const password =
document
.getElementById("adminPassword")
.value;

if(!email || !password){

loginMessage.textContent =
"Please enter your email and password.";

return;

}

loginButton.disabled = true;

loginMessage.textContent =
"Logging in...";

try{

const response =
await fetch(
`${SUPABASE_URL}/auth/v1/token?grant_type=password`,
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email,
password:password
})

}
);

const data =
await response.json();

console.log(
"SUPABASE LOGIN RESPONSE:",
data
);

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
data.message ||
"Login failed."
);

}

if(!data.access_token){

throw new Error(
"No access token was returned."
);

}

if(!data.user){

throw new Error(
"No user account was returned."
);

}

if(
data.user.id !==
ADMIN_USER_ID
){

throw new Error(
"This account is not authorized as admin."
);

}

localStorage.setItem(
"admin_access_token",
data.access_token
);

localStorage.setItem(
"admin_refresh_token",
data.refresh_token || ""
);

loginMessage.textContent =
"Login successful!";

loginForm.reset();

showDashboard();

}
catch(error){

console.error(
"LOGIN ERROR:",
error
);

loginMessage.textContent =
error.message ||
"Login failed.";

}
finally{

loginButton.disabled = false;

}

});

document.getElementById(
`deposit-${bookingId}`
);

);

return;

}

const deposit =
input.value.trim();

if(deposit === ""){

alert(
"Please enter a deposit amount."
);

return;

}

try{

const response =
await fetch(
`${SUPABASE_URL}/rest/v1/Bookings?idd=eq.${encodeURIComponent(bookingId)}`,
{
method:"PATCH",

headers:{
...getHeaders(),
"Prefer":"return=minimal"
},

body:JSON.stringify({

"Deposit amount":
deposit

})

}
);

if(!response.ok){

const text =
await response.text();

throw new Error(
text ||
"Could not save deposit amount."
);

alert(
"Deposit amount saved."

await loadBookings();

console.error(error);

alert(
error.message
);

}

/* =========================
FIND BOOKING
========================= */

async function findBookingByReference(
reference
){

if(!reference){

return null;

}

const response =
await fetch(
`${SUPABASE_URL}/rest/v1/Bookings?Booking%20reference=eq.${encodeURIComponent(reference)}&select=*`,
{
method:"GET",

headers:getHeaders()
}
);

if(!response.ok){

console.error(
"Could not find matching booking."
);

return null;

}

const bookings =
await response.json();

if(!bookings.length){

return null;

}

return bookings[0];

}

/* =========================
REJECT PAYMENT
========================= */

async function rejectPaymentByIndex(
index
){

const payment =
window.currentPayments[index];

if(!payment){

alert(
"Payment could not be found."
);

return;

}

if(!confirm(
"Reject this payment?"
)){

return;

}

try{

await updatePaymentStatus(
payment,
"Rejected"
);

alert(
"Payment rejected."
);

await loadPayments();

}
catch(error){

console.error(error);

alert(
error.message
);

}

}

/* =========================
LOAD FLASH DESIGNS
========================= */

async function loadFlashDesigns(){

flashDesignsList.innerHTML =
"Loading flash designs...";

try{

const response =
await fetch(
`${SUPABASE_URL}/rest/v1/flash_designs?select=*&order=created_at.desc`,
{
method:"GET",

headers:{
"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"
}

}
);

if(!response.ok){

const text =
await response.text();

throw new Error(
text ||
"Could not load flash designs."
);

}

const designs =
await response.json();

console.log(
"FLASH DESIGNS:",
designs
);

if(!designs.length){

flashDesignsList.innerHTML =
"<p>No flash designs added yet.</p>";

return;

}

flashDesignsList.innerHTML =
designs.map(
function(design){

return `

<div class="booking">

<div class="row">

<span class="label">
Name:
</span>

${design.name || ""}

</div>

<div class="row">

<span class="label">
Price:
</span>

$${design.price || ""}

</div>

${
design.image_url
?
`
<img
src="${design.image_url}"
class="flash-image"
>
`
:
""
}

</div>

`;

}
).join("");

}
catch(error){

console.error(
"FLASH DESIGN ERROR:",
error
);

flashDesignsList.innerHTML =
`<p>${error.message}</p>`;

}

}


/* =========================
ADD FLASH DESIGN
========================= */

addFlashDesignButton.addEventListener(
"click",
async function(){

const name =
flashDesignName.value.trim();

const price =
flashDesignPrice.value.trim();

const file =
flashDesignImage.files[0];

if(!name){

alert(
"Please enter a design name."
);

return;

}

if(!price){

alert(
"Please enter a price."
);

return;

}

if(!file){

alert(
"Please select an image."
);

return;

}

addFlashDesignButton.disabled =
true;

flashDesignMessage.textContent =
"Uploading design...";

try{

const fileName =
`${Date.now()}-${file.name.replace(
/[^a-zA-Z0-9.-]/g,
"-"
)}`;

const uploadResponse =
await fetch(
`${SUPABASE_URL}/storage/v1/object/flash-designs/${encodeURIComponent(fileName)}`,
{
method:"POST",

headers:{

"Authorization":
`Bearer ${localStorage.getItem(
"admin_access_token"
)}`,

"apikey":
SUPABASE_KEY,

"Content-Type":
file.type

},

body:file

}
);

if(!uploadResponse.ok){

const text =
await uploadResponse.text();

throw new Error(
text ||
"Could not upload image."
);

}

const imageUrl =
`${SUPABASE_URL}/storage/v1/object/public/flash-designs/${encodeURIComponent(fileName)}`;

const saveResponse =
await fetch(
`${SUPABASE_URL}/rest/v1/flash_designs`,
{
method:"POST",

headers:{
...getHeaders(),
"Prefer":"return=minimal"
},

body:JSON.stringify({

name:name,

price:price,

image_url:imageUrl

})

}
);

if(!saveResponse.ok){

const text =
await saveResponse.text();

throw new Error(
text ||
"Image uploaded but design could not be saved."
);

}

flashDesignName.value =
"";

flashDesignPrice.value =
"";

flashDesignImage.value =
"";

flashDesignMessage.textContent =
"Flash design added successfully.";

await loadFlashDesigns();

}
catch(error){

console.error(
"ADD FLASH DESIGN ERROR:",
error
);

flashDesignMessage.textContent =
error.message;

}
finally{

addFlashDesignButton.disabled =
false;

}

});
