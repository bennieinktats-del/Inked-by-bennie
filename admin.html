<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inked by Bennie - Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
}

.container{
  width:92%;
  max-width:1100px;
  margin:30px auto;
}

h1,h2{color:#d4af37}

.card{
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}

input,button{
  width:100%;
  padding:12px;
  margin:7px 0;
  border-radius:6px;
  font-size:15px;
}

input{
  background:#222;
  color:#fff;
  border:1px solid #555;
}

button{
  background:#d4af37;
  color:#000;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

button:hover{opacity:.85}

.danger{
  background:#8b0000;
  color:#fff;
}

.secondary{
  background:#333;
  color:#fff;
}

.hidden{display:none}

.booking,.payment{
  border:1px solid #333;
  border-radius:8px;
  padding:15px;
  margin:12px 0;
}

.label{
  color:#d4af37;
  font-weight:bold;
}

.row{
  margin:7px 0;
  word-break:break-word;
}

.deposit-box{
  margin-top:15px;
  padding:12px;
  border:1px solid #444;
  border-radius:8px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.actions button{margin:0}

.message{
  margin-top:10px;
  padding:10px;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<section id="loginSection" class="card">

<h1>Inked by Bennie</h1>
<h2>Admin Login</h2>

<form id="loginForm">

<input
type="email"
id="adminEmail"
placeholder="Admin Email"
required
>

<input
type="password"
id="adminPassword"
placeholder="Password"
required
>

<button type="submit" id="loginButton">
Login
</button>

</form>

<div id="loginMessage"></div>

</section>


<!-- DASHBOARD -->

<section id="dashboardSection" class="hidden">

<div class="card">

<h1>Admin Dashboard</h1>

<button id="logoutButton" class="danger">
Logout
</button>

</div>


<!-- PAYMENTS -->

<div class="card">

<h2>Gift Card Payments</h2>

<button id="refreshPayments" class="secondary">
Refresh Payments
</button>

<div id="paymentsList">
Loading payments...
</div>

</div>


<!-- BOOKINGS -->

<div class="card">

<h2>Bookings</h2>

<button id="refreshBookings" class="secondary">
Refresh Bookings
</button>

<div id="bookingsList">
Loading bookings...
</div>

</div>

</section>

</div>


<script>

const SUPABASE_URL =
"https://medadmstfuxqjnemjjqs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_sPyYiyiKojy72MhKVCMvxQ_3I8gmUIO";

const ADMIN_USER_ID =
"a76ab4e3-1744-4d8e-8a62-510a4c4bfb00";


/* BOOKING APPROVAL EMAIL */

const APPROVAL_EMAIL_FUNCTION_URL =
"https://medadmstfuxqjnemjjqs.supabase.co/functions/v1/enking-approval";


/* PAYMENT APPROVAL EMAIL */

const PAYMENT_APPROVAL_EMAIL_FUNCTION_URL =
"https://medadmstfuxqjnemjjqs.supabase.co/functions/v1/send-approved-booking-email";


let currentBookings = [];


const loginSection =
document.getElementById("loginSection");

const dashboardSection =
document.getElementById("dashboardSection");

const loginForm =
document.getElementById("loginForm");

const loginMessage =
document.getElementById("loginMessage");

const paymentsList =
document.getElementById("paymentsList");

const bookingsList =
document.getElementById("bookingsList");


/* =========================
LOGIN
========================= */

loginForm.addEventListener("submit", async function(event){

event.preventDefault();

const email =
document.getElementById("adminEmail").value.trim();

const password =
document.getElementById("adminPassword").value;

loginMessage.textContent =
"Logging in...";

try{

const response =
await fetch(
`${SUPABASE_URL}/auth/v1/token?grant_type=password`,
{
method:"POST",

headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json"
},

body:JSON.stringify({
email:email,
password:password
})
}
);

const data =
await response.json();

if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
"Login failed."
);

}

if(
!data.access_token ||
!data.refresh_token
){

throw new Error(
"Login did not return a valid session."
);

}

if(
!data.user ||
data.user.id !== ADMIN_USER_ID
){

throw new Error(
"This account is not authorized as admin."
);

}

localStorage.setItem(
"admin_access_token",
data.access_token
);

localStorage.setItem(
"admin_refresh_token",
data.refresh_token
);

showDashboard();

}
catch(error){

console.error(error);

loginMessage.textContent =
error.message ||
"Login failed.";

}

});


/* =========================
SHOW DASHBOARD
========================= */

function showDashboard(){

loginSection.classList.add("hidden");

dashboardSection.classList.remove("hidden");

loadBookings();

loadPayments();

}


/* =========================
LOGOUT
========================= */

document
.getElementById("logoutButton")
.addEventListener("click",function(){

localStorage.removeItem(
"admin_access_token"
);

localStorage.removeItem(
"admin_refresh_token"
);

dashboardSection.classList.add("hidden");

loginSection.classList.remove("hidden");

});


/* =========================
HEADERS
========================= */

function getHeaders(){

const token =
localStorage.getItem(
"admin_access_token"
);

return{

"apikey":SUPABASE_KEY,

"Authorization":
`Bearer ${token}`,

"Content-Type":
"application/json"

};

}


/* =========================
LOAD BOOKINGS
========================= */

async function loadBookings(){

bookingsList.innerHTML =
"Loading bookings...";

try{

const response =
await fetch(
`${SUPABASE_URL}/rest/v1/Bookings?select=*&order=idd.desc`,
{
headers:getHeaders()
}
);

if(!response.ok){

throw new Error(
"Could not load bookings."
);

}

const bookings =
await response.json();

currentBookings = bookings;


if(!bookings.length){

bookingsList.innerHTML =
"<p>No bookings found.</p>";

return;

}


bookingsList.innerHTML =
bookings.map(function(booking,index){

const reference =
booking["Booking reference"] ||
booking["booking_reference"] ||
booking["booking reference"] ||
"";

const status =
booking["Booking status"] || "";

const deposit =
booking["Deposit amount"] ||
booking["deposit_amount"] ||
"";


return `

<div class="booking">

<div class="row">
<span class="label">Client:</span>
${booking["Client"] || ""}
</div>

<div class="row">
<span class="label">Email:</span>
${booking["Email"] || ""}
</div>

<div class="row">
<span class="label">Phone:</span>
${booking["Phone"] || ""}
</div>

<div class="row">
<span class="label">Booking Reference:</span>
${reference}
</div>

<div class="row">
<span class="label">Tattoo:</span>
${booking["Tattoo"] || ""}
</div>

<div class="row">
<span class="label">Type:</span>
${booking["Type"] || ""}
</div>

<div class="row">
<span class="label">Preferred Date:</span>
${booking["Preferred date"] || ""}
</div>

<div class="row">
<span class="label">Preferred Time:</span>
${booking["Preferred time"] || ""}
</div>


<div class="deposit-box">

<div class="label">
Deposit Amount
</div>

<input
type="number"
step="0.01"
min="0"
id="deposit-${booking.idd}"
value="${deposit}"
placeholder="Enter deposit amount"
>

<button
type="button"
onclick="saveDeposit('${booking.idd}')">
Save Deposit
</button>

</div>


<div class="row">
<span class="label">Booking Status:</span>
${status}
</div>


<div class="actions">

<button
type="button"
onclick="approveBookingByIndex(${index})">
Approve Booking
</button>

<button
type="button"
class="danger"
onclick="rejectBookingByIndex(${index})">
Reject Booking
</button>

</div>

</div>

`;

}).join("");

}
catch(error){

console.error(error);

bookingsList.innerHTML =
`<p>${error.message}</p>`;

}

}


/* =========================
SAVE DEPOSIT
========================= */

async function saveDeposit(bookingId){

const input =
document.getElementById(
`deposit-${bookingId}`
);

if(!input){

alert(
"Deposit field not found."
);

return;

}

const deposit =
input.value.trim();

if(deposit === ""){

alert(
"Please enter a deposit amount."
);

return;

}

try{

const response =
await fetch(
`${SUPABASE_URL}/rest/v1/Bookings?idd=eq.${encodeURIComponent(bookingId)}`,
{
method:"PATCH",

headers:{
...getHeaders(),
"Prefer":"return=minimal"
},

body:JSON.stringify({

"Deposit amount":
deposit

})
}
);

if(!response.ok){

const text =
await response.text();

throw new Error(
text ||
"Could not save deposit amount."
);

}

alert(
"Deposit amount saved."
);

await loadBookings();

}
catch(error){

console.error(error);

alert(
error.message
);

}

}


/* =========================
UPDATE BOOKING STATUS
========================= */

async function updateBookingStatus(
booking,
newStatus
){

const response =
await fetch(
`${SUPABASE_URL}/rest/v1/Bookings?idd=eq.${encodeURIComponent(booking.idd)}`,
{
method:"PATCH",

headers:{
...getHeaders(),
"Prefer":"return=minimal"
},

body:JSON.stringify({

"Booking status":
newStatus

})
}
);

if(!response.ok){

const text =
await response.text();

throw new Error(
text ||
"Could not update booking status."
);

}

}


/* =========================
APPROVE BOOKING
========================= */

async function approveBookingByIndex(index){

const booking =
currentBookings[index];

if(!booking){

alert(
"Booking could not be found."
);

return;

}

if(!confirm(
"Approve this booking?"
)){

return;

}


const reference =
booking["Booking reference"] ||
booking["booking_reference"] ||
"";

const clientName =
booking["Client"] || "";

const email =
booking["Email"] || "";

const preferredDate =
booking["Preferred date"] || "";

const preferredTime =
booking["Preferred time"] || "";

const deposit =
booking["Deposit amount"] ||
booking["deposit_amount"] ||
"";


try{

await updateBookingStatus(
booking,
"Approved"
);

await loadBookings();


const response =
await fetch(
APPROVAL_EMAIL_FUNCTION_URL,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

client_name:
clientName,

email:
email,

booking_reference:
reference,

preferred_date:
preferredDate,

preferred_time:
preferredTime,

deposit_amount:
deposit

})
}
);


if(!response.ok){

console.error(
await response.text()
);

alert(
"Booking approved, but the email could not be sent."
);

return;

}


alert(
"Booking approved and email sent."
);

}
catch(error){

console.error(error);

alert(
error.message
);

}

}


/* =========================
REJECT BOOKING
========================= */

async function rejectBookingByIndex(index){

const booking =
currentBookings[index];

if(!booking){

alert(
"Booking could not be found."
);

return;

}

if(!confirm(
"Reject this booking?"
)){

return;

}


try{

await updateBookingStatus(
booking,
"Rejected"
);

alert(
"Booking rejected."
);

await loadBookings();

}
catch(error){

console.error(error);

alert(
error.message
);

}

}


/* =========================
LOAD PAYMENTS
========================= */

async function loadPayments(){

paymentsList.innerHTML =
"Loading payments...";

try{

const response =
await fetch(
`${SUPABASE_URL}/rest/v1/Gift%20card%20payments?select=*&order=Created%20at.desc`,
{
headers:getHeaders()
}
);

if(!response.ok){

throw new Error(
"Could not load payments."
);

}

const payments =
await response.json();


if(!payments.length){

paymentsList.innerHTML =
"<p>No gift card payments found.</p>";

return;

}


paymentsList.innerHTML =
payments.map(function(payment,index){

const reference =
payment["Booking reference"] ||
payment["booking_reference"] ||
"";

const status =
payment["Payment status"] ||
"";


return `

<div class="payment">

<div class="row">
<span class="label">Name:</span>
${payment["Name"] || ""}
</div>

<div class="row">
<span class="label">Email:</span>
${payment["Email"] || ""}
</div>

<div class="row">
<span class="label">Phone:</span>
${payment["Phone"] || ""}
</div>

<div class="row">
<span class="label">Booking Reference:</span>
${reference}
</div>

<div class="row">
<span class="label">Gift Card Brand:</span>
${payment["Gift card brand"] || ""}
</div>

<div class="row">
<span class="label">Gift Card Amount:</span>
$${payment["Gift card amount"] || ""}
</div>

<div class="row">
<span class="label">Deposit Amount:</span>
$${payment["Deposit amount"] || ""}
</div>

<div class="row">
<span class="label">Payment Type:</span>
${payment["Payment type"] || ""}
</div>

<div class="row">
<span class="label">Payment Status:</span>
${status}
</div>

<div class="actions">

<button
type="button"
onclick="approvePaymentByIndex(${index})">
Approve Payment
</button>

<button
type="button"
class="danger"
onclick="rejectPaymentByIndex(${index})">
Reject Payment
</button>

</div>

</div>

`;

}).join("");


window.currentPayments =
payments;

}
catch(error){

console.error(error);

paymentsList.innerHTML =
`<p>${error.message}</p>`;

}

}


/* =========================
UPDATE PAYMENT
========================= */

async function updatePaymentStatus(
payment,
newStatus
){

const reference =
payment["Booking reference"] ||
payment["booking_reference"] ||
"";

if(!reference){

throw new Error(
"Payment has no booking reference."
);

}


const response =
await fetch(
`${SUPABASE_URL}/rest/v1/Gift%20card%20payments?Booking%20reference=eq.${encodeURIComponent(reference)}`,
{
method:"PATCH",

headers:{
...getHeaders(),
"Prefer":"return=minimal"
},

body:JSON.stringify({

"Payment status":
newStatus

})
}
);


if(!response.ok){

const text =
await response.text();

throw new Error(
text ||
"Could not update payment status."
);

}

}


/* =========================
APPROVE PAYMENT
========================= */

async function approvePaymentByIndex(index){

const payment =
window.currentPayments[index];

if(!payment){

alert(
"Payment could not be found."
);

return;

}


if(!confirm(
"Approve this payment?"
)){

return;

}


const reference =
payment["Booking reference"] ||
payment["booking_reference"] ||
"";


try{

await updatePaymentStatus(
payment,
"Approved"
);


const response =
await fetch(
PAYMENT_APPROVAL_EMAIL_FUNCTION_URL,
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

client_name:
payment["Name"] || "",

email:
payment["Email"] || "",

booking_reference:
reference,

preferred_date:
payment["Preferred date"] || "",

preferred_time:
payment["Preferred time"] || "",

deposit_amount:
payment["Deposit amount"] || ""

})
}
);


if(!response.ok){

console.error(
await response.text()
);

alert(
"Payment approved, but the email could not be sent."
);

await loadPayments();

return;

}


alert(
"Payment approved and email sent."
);

await loadPayments();

}
catch(error){

console.error(error);

alert(
error.message
);

}

}


/* =========================
REJECT PAYMENT
========================= */

async function rejectPaymentByIndex(index){

const payment =
window.currentPayments[index];

if(!payment){

alert(
"Payment could not be found."
);

return;

}


if(!confirm(
"Reject this payment?"
)){

return;

}


try{

await updatePaymentStatus(
payment,
"Rejected"
);

alert(
"Payment rejected."
);

await loadPayments();

}
catch(error){

console.error(error);

alert(
error.message
);

}

}


/* =========================
REFRESH
========================= */

document
.getElementById("refreshBookings")
.addEventListener(
"click",
loadBookings
);

document
.getElementById("refreshPayments")
.addEventListener(
"click",
loadPayments
);


/* =========================
AUTO LOGIN
========================= */

const savedToken =
localStorage.getItem(
"admin_access_token"
);

if(savedToken){

showDashboard();

}

</script>

</body>
  </html>
