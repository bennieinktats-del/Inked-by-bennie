<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inked by Bennie — Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1,
    h2 {
      color: #d4af37;
    }

    .card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 14px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .gold {
      background: #d4af37;
      color: #000;
    }

    .approve {
      background: #2e8b57;
      color: white;
    }

    .reject {
      background: #a83232;
      color: white;
    }

    .logout {
      background: #333;
      color: white;
      float: right;
    }

    .booking {
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      margin: 12px 0;
      background: #101010;
    }

    .status {
      font-weight: bold;
    }

    .pending {
      color: #d4af37;
    }

    .approved {
      color: #7CFC98;
    }

    .rejected {
      color: #ff6b6b;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
    }

    .error {
      color: #ff6b6b;
      word-break: break-word;
    }

    .success {
      color: #7CFC98;
      font-weight: bold;
    }

    .deposit-box {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #d4af37;
      border-radius: 8px;
      background: #181818;
    }

    .deposit-box label {
      display: block;
      color: #d4af37;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .save-deposit {
      width: 100%;
      margin-top: 4px;
    }

    .action-box {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .action-box button {
      flex: 1;
      min-width: 130px;
    }

  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div id="loginSection" class="card">

    <h1>Inked by Bennie</h1>

    <h2>Admin Login</h2>

    <form id="loginForm">

      <label>Email</label>

      <input
        type="email"
        id="adminEmail"
        required
        placeholder="Admin email"
      >

      <label>Password</label>

      <input
        type="password"
        id="adminPassword"
        required
        placeholder="Password"
      >

      <button
        class="gold"
        type="submit"
      >
        Login
      </button>

    </form>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>


  <!-- ADMIN DASHBOARD -->

  <div
    id="dashboardSection"
    class="hidden"
  >

    <button
      id="logoutButton"
      class="logout"
    >
      Log out
    </button>

    <h1>Admin Dashboard</h1>

    <div class="card">

      <h2>Bookings</h2>

      <button
        id="refreshBookings"
        class="gold"
      >
        Refresh Bookings
      </button>

      <div id="bookingsList">
        Loading bookings...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://medadmstfuxqjnemjjqs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sPyYiyiKojy72MhKVCMvxQ_3I8gmUIO";


/*
  ONLY THIS USER IS ALLOWED
  TO ACCESS THE ADMIN DASHBOARD.
*/

const ADMIN_USER_ID =
  "a76ab4e3-1744-4d8e-8a62-510a4c4bfb00";


const loginSection =
  document.getElementById("loginSection");

const dashboardSection =
  document.getElementById("dashboardSection");

const loginForm =
  document.getElementById("loginForm");

const loginMessage =
  document.getElementById("loginMessage");

const bookingsList =
  document.getElementById("bookingsList");

const logoutButton =
  document.getElementById("logoutButton");

const refreshBookings =
  document.getElementById("refreshBookings");


// ===============================
// LOGIN
// ===============================

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
      document
        .getElementById("adminEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("adminPassword")
        .value;

    loginMessage.textContent =
      "Logging in...";

    loginMessage.className =
      "message";

    try {

      const response =
        await fetch(
          `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
          {
            method: "POST",

            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email: email,
              password: password
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error_description ||
          data.msg ||
          data.message ||
          "Login failed"
        );

      }


      /*
        SECURITY CHECK:
        Make sure the logged-in account
        is the designated admin account.
      */

      if (
        !data.user ||
        data.user.id !== ADMIN_USER_ID
      ) {

        localStorage.removeItem(
          "supabase_access_token"
        );

        localStorage.removeItem(
          "supabase_refresh_token"
        );

        throw new Error(
          "This account is not authorized to access the admin dashboard."
        );

      }


      localStorage.setItem(
        "supabase_access_token",
        data.access_token
      );

      localStorage.setItem(
        "supabase_refresh_token",
        data.refresh_token
      );


      loginMessage.textContent = "";

      loginSection.classList.add(
        "hidden"
      );

      dashboardSection.classList.remove(
        "hidden"
      );

      loadBookings();

    }

    catch(error) {

      console.error(
        "LOGIN ERROR:",
        error
      );

      loginMessage.textContent =
        error.message ||
        "Login failed. Please check your email and password.";

      loginMessage.className =
        "message error";

    }

  }
);


// ===============================
// UPDATE BOOKING STATUS
// ===============================

async function updateBookingStatus(
  bookingId,
  newStatus,
  messageElement
) {

  const token =
    localStorage.getItem(
      "supabase_access_token"
    );


  if (!token) {

    messageElement.textContent =
      "Your admin session has expired. Please log in again.";

    messageElement.className =
      "message error";

    return;

  }


  messageElement.textContent =
    "Updating...";

  messageElement.className =
    "message";


  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/Bookings?idd=eq.${encodeURIComponent(bookingId)}`,
        {
          method: "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            "Booking status":
              newStatus

          })

        }
      );


    const responseText =
      await response.text();


    if (!response.ok) {

      console.error(
        "STATUS UPDATE ERROR:",
        responseText
      );

      throw new Error(
        responseText ||
        "Unable to update booking status."
      );

    }


    messageElement.textContent =
      `Booking marked as ${newStatus}.`;

    messageElement.className =
      "message success";


    loadBookings();

  }

  catch(error) {

    console.error(
      "STATUS ERROR:",
      error
    );

    messageElement.textContent =
      "Could not update booking: " +
      error.message;

    messageElement.className =
      "message error";

  }

}


// ===============================
// SAVE DEPOSIT AMOUNT
// ===============================

async function saveDepositAmount(
  bookingId,
  inputElement,
  messageElement
) {

  const token =
    localStorage.getItem(
      "supabase_access_token"
    );


  if (!token) {

    messageElement.textContent =
      "Your admin session has expired. Please log in again.";

    messageElement.className =
      "message error";

    return;

  }


  const amount =
    inputElement.value.trim();


  if (
    !amount ||
    Number(amount) <= 0
  ) {

    messageElement.textContent =
      "Please enter a valid deposit amount.";

    messageElement.className =
      "message error";

    return;

  }


  messageElement.textContent =
    "Saving...";

  messageElement.className =
    "message";


  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/Bookings?idd=eq.${encodeURIComponent(bookingId)}`,
        {
          method: "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body: JSON.stringify({

            deposit_amount:
              Number(amount)

          })

        }
      );


    const responseText =
      await response.text();


    if (!response.ok) {

      console.error(
        "DEPOSIT SAVE ERROR:",
        responseText
      );

      throw new Error(
        responseText ||
        "Unable to save deposit amount."
      );

    }


    messageElement.textContent =
      `Deposit saved: $${Number(amount).toFixed(2)}`;

    messageElement.className =
      "message success";

  }

  catch(error) {

    console.error(
      "DEPOSIT ERROR:",
      error
    );

    messageElement.textContent =
      "Could not save deposit: " +
      error.message;

    messageElement.className =
      "message error";

  }

}


// ===============================
// LOAD BOOKINGS
// ===============================

async function loadBookings() {

  bookingsList.innerHTML =
    "<p>Loading bookings...</p>";


  const token =
    localStorage.getItem(
      "supabase_access_token"
    );


  if (!token) {

    bookingsList.innerHTML =
      "<p class='error'>Your admin session has expired. Please log in again.</p>";

    return;

  }


  try {

    const response =
      await fetch(
        `${SUPABASE_URL}/rest/v1/Bookings?select=*&order=idd.desc`,
        {
          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${token}`,

            "Content-Type":
              "application/json"

          }

        }
      );


    const responseText =
      await response.text();


    let bookings;


    try {

      bookings =
        JSON.parse(responseText);

    }

    catch {

      throw new Error(
        "Supabase returned an unexpected response: " +
        responseText
      );

    }


    if (!response.ok) {

      throw new Error(
        JSON.stringify(bookings)
      );

    }


    if (!Array.isArray(bookings)) {

      throw new Error(
        "The Bookings response was not a list."
      );

    }


    if (bookings.length === 0) {

      bookingsList.innerHTML =
        "<p>No bookings yet.</p>";

      return;

    }


    bookingsList.innerHTML = "";


    bookings.forEach(
      function(booking) {

        const div =
          document.createElement("div");

        div.className =
          "booking";


        const currentStatus =
          booking["Booking status"] ||
          "Pending";


        let statusClass =
          "pending";


        if (
          currentStatus === "Approved"
        ) {

          statusClass =
            "approved";

        }


        if (
          currentStatus === "Rejected"
        ) {

          statusClass =
            "rejected";

        }


        div.innerHTML = `

          <p>
            <strong>Client:</strong>
            ${booking["Client name"] || ""}
          </p>

          <p>
            <strong>Booking reference:</strong>
            ${booking["booking_reference"] || "Not available"}
          </p>

          <p>
            <strong>Email:</strong>
            ${booking["Email"] || ""}
          </p>

          <p>
            <strong>Phone:</strong>
            ${booking["Phone"] || ""}
          </p>

          <p>
            <strong>Tattoo:</strong>
            ${booking["Tattoo details"] || ""}
          </p>

          <p>
            <strong>Type:</strong>
            ${booking["tattoo_type"] || ""}
          </p>

          <p>
            <strong>Placement:</strong>
            ${booking["Placement"] || ""}
          </p>

          <p>
            <strong>Size:</strong>
            ${booking["Size"] || ""}
          </p>

          <p>
            <strong>Preferred date:</strong>
            ${booking["preferred_date"] || "Not provided"}
          </p>

          <p>
            <strong>Preferred time:</strong>
            ${booking["preferred_time"] || "Not provided"}
          </p>

          <p>
            <strong>Additional details:</strong>
            ${booking["Additional details"] || "None"}
          </p>

          <p>

            <strong>Booking status:</strong>

            <span class="status ${statusClass}">
              ${currentStatus}
            </span>

          </p>

          <p>

            <strong>Deposit status:</strong>

            ${booking["Deposit status"] || "Not paid"}

          </p>


          <div class="deposit-box">

            <label>
              Deposit amount
            </label>

            <input
              type="number"
              class="deposit-input"
              min="1"
              step="0.01"
              placeholder="Example: 100"
              value="${booking["deposit_amount"] || ""}"
            >

            <button
              class="gold save-deposit"
              type="button"
            >
              Save Deposit
            </button>

            <div
              class="message deposit-message"
            ></div>

          </div>


          <div class="action-box">

            <button
              class="approve approve-button"
              type="button"
            >
              Approve Booking
            </button>

            <button
              class="reject reject-button"
              type="button"
            >
              Reject Booking
            </button>

          </div>


          <div
            class="message status-message"
          ></div>

        `;


        const depositInput =
          div.querySelector(
            ".deposit-input"
          );


        const saveButton =
          div.querySelector(
            ".save-deposit"
          );


        const depositMessage =
          div.querySelector(
            ".deposit-message"
          );


        const approveButton =
          div.querySelector(
            ".approve-button"
          );


        const rejectButton =
          div.querySelector(
            ".reject-button"
          );


        const statusMessage =
          div.querySelector(
            ".status-message"
          );


        saveButton.addEventListener(
          "click",
          function() {

            saveDepositAmount(

              booking.idd,

              depositInput,

              depositMessage

            );

          }
        );


        approveButton.addEventListener(
          "click",
          function() {

            updateBookingStatus(

              booking.idd,

              "Approved",

              statusMessage

            );

          }
        );


        rejectButton.addEventListener(
          "click",
          function() {

            updateBookingStatus(

              booking.idd,

              "Rejected",

              statusMessage

            );

          }
        );


        bookingsList.appendChild(
          div
        );

      }
    );

  }

  catch(error) {

    console.error(
      "BOOKING LOAD ERROR:",
      error
    );

    bookingsList.innerHTML = `

      <p class="error">
        Unable to load bookings.
      </p>

      <p class="error">
        ${error.message}
      </p>

    `;

  }

}


// ===============================
// REFRESH BOOKINGS
// ===============================

refreshBookings.addEventListener(
  "click",
  loadBookings
);


// ===============================
// LOG OUT
// ===============================

logoutButton.addEventListener(
  "click",
  function() {

    localStorage.removeItem(
      "supabase_access_token"
    );

    localStorage.removeItem(
      "supabase_refresh_token"
    );


    dashboardSection.classList.add(
      "hidden"
    );


    loginSection.classList.remove(
      "hidden"
    );

  }
);


// ===============================
// CHECK EXISTING LOGIN
// ===============================

if (
  localStorage.getItem(
    "supabase_access_token"
  )
) {

  loginSection.classList.add(
    "hidden"
  );

  dashboardSection.classList.remove(
    "hidden"
  );

  loadBookings();

}

</script>

</body>
        </html>
